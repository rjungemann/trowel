name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Required for manual runs.'
        required: true

jobs:
  macos:
    name: Build, sign, notarize macOS
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Strip leading v from tag
        id: version
        run: |
          raw="${VERSION#v}"
          echo "version=${raw}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: brew install cmake ninja qt@6

      - name: Import Developer ID certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "==> Installing Apple intermediate CAs"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"    https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"  https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/AppleRootCA-G2.cer"   https://www.apple.com/certificateauthority/AppleRootCA-G2.cer
          curl -fsSL -o "$RUNNER_TEMP/AppleRootCA-G3.cer"   https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
          for cer in "$RUNNER_TEMP"/*.cer; do
            security import "$cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          done

          echo "==> Importing Developer ID certificate"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          LOGIN_KC="$HOME/Library/Keychains/login.keychain-db"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KC"
          security default-keychain -s "$KEYCHAIN"

          echo "==> All identities in $KEYCHAIN"
          security find-identity -v "$KEYCHAIN"
          echo "==> Codesigning-valid identities in $KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DTROWEL_CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Build
        run: |
          LOGIN_KC="$HOME/Library/Keychains/login.keychain-db"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KC"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning
          cmake --build build

      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials trowel-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Notarize and staple
        run: scripts/notarize-app.sh build/trowel.app trowel-notary

      - name: Package release zip
        id: package
        run: |
          VERSION_STRIPPED='${{ steps.version.outputs.version }}'
          OUT="dist/Trowel-${VERSION_STRIPPED}.zip"
          mkdir -p dist
          rm -f "$OUT"
          ditto -c -k --keepParent build/trowel.app "$OUT"
          SHA=$(shasum -a 256 "$OUT" | awk '{print $1}')
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "## Trowel ${VERSION_STRIPPED}" > dist/notes.md
          echo "" >> dist/notes.md
          echo "**SHA-256:** \`$SHA\`" >> dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Trowel ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          files: ${{ steps.package.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Update Homebrew cask on main
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK=Casks/trowel.rb

          # Work on a fresh checkout of main so the tagged-ref checkout above
          # doesn't turn into a detached-HEAD push. Use the token the
          # workflow already has (contents: write).
          git config user.name "trowel-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          python3 - "$CASK" "$NEW_VERSION" "$NEW_SHA" <<'PY'
          import re, sys, pathlib
          path, version, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path(path)
          src = p.read_text()
          src = re.sub(r'^(\s*version\s+)"[^"]*"', rf'\1"{version}"', src, count=1, flags=re.M)
          src = re.sub(r'^(\s*sha256\s+)"[^"]*"', rf'\1"{sha}"',    src, count=1, flags=re.M)
          p.write_text(src)
          PY

          if git diff --quiet -- "$CASK"; then
              echo "cask already up to date; nothing to commit"
              exit 0
          fi

          git add "$CASK"
          git commit -m "chore: update cask for v${NEW_VERSION}

          Automated cask bump from the release workflow. Points at
          Trowel-${NEW_VERSION}.zip with SHA-256 ${NEW_SHA}."

          # Small retry loop in case someone pushed to main between the
          # tag build starting and this commit landing.
          for attempt in 1 2 3; do
              if git push origin main; then
                  exit 0
              fi
              echo "push failed (attempt $attempt), rebasing on latest main"
              git fetch origin main
              git rebase origin/main
          done
          echo "failed to push cask update after 3 attempts" >&2
          exit 1

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

  linux:
    name: Build AppImage (${{ matrix.arch }})
    # Gate behind the macOS job, which creates the GitHub Release. These jobs
    # then only append their AppImage assets, so there's no create-vs-update
    # race on the release. (If you ever want Linux to ship even when macOS
    # fails, split the release-creation into its own job like Turmeric does.)
    needs: macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ curl file desktop-file-utils \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev libqt6core5compat6 \
            libgl1-mesa-dev libxkbcommon-dev \
            libedit2

      - name: Build AppImage
        run: scripts/build-appimage.sh ${{ matrix.arch }}

      - name: Smoke-test the AppImage (headless, bundled Qt + Turmeric)
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install -q pytest
          APP=$(ls dist/Trowel-*-${{ matrix.arch }}.AppImage)
          ( cd "$RUNNER_TEMP" && APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$APP" --appimage-extract >/dev/null )
          cd tests/smoke
          env -u TUR_STDLIB_DIR \
            TROWEL_BIN="$RUNNER_TEMP/squashfs-root/AppRun" \
            PATH="/usr/bin:/bin" \
            /tmp/smoke-venv/bin/python -m pytest -q

      - name: Checksum
        id: pkg
        run: |
          APP=$(ls dist/Trowel-*-${{ matrix.arch }}.AppImage)
          sha256sum "$APP" | awk '{print $1}' > "${APP}.sha256"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat "${APP}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.sha256
          fail_on_unmatched_files: true

  # Windows support merged (PR #6) and is built by ci.yml on every push -- but
  # this workflow had no Windows job at all, so every release shipped macOS and
  # Linux only. The port was verified and unreachable: a user on Windows could
  # not get it.
  #
  # Same shape as the linux job: gated behind `macos`, which creates the
  # GitHub Release; this only appends assets, so there is no create-vs-update
  # race.
  windows:
    name: Build Windows zip (x86_64)
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Before checkout: git on Windows defaults to core.autocrlf=true, and the
      # tree is line-ending sensitive (see the same step in ci.yml).
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      # qt6-tools is what provides windeployqt6; the rest matches ci.yml.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            zip

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # CMake stages the pinned Turmeric next to the binary as build/turmeric/,
      # so the package picks it up with the tree below.
      - name: Build
        run: cmake --build build -j

      # windeployqt is NECESSARY BUT NOT SUFFICIENT, and the gap is the whole
      # reason this step is written out rather than being one command.
      #
      # It collects Qt's own DLLs and plugins (platforms/qwindows.dll, styles,
      # tls, imageformats) and NOTHING ELSE. Measured on a real build of this
      # tree: it left all 24 of the MinGW and third-party runtime DLLs behind --
      # libgcc_s_seh-1, libstdc++-6, libwinpthread-1, the ICU trio, harfbuzz,
      # freetype, zlib, pcre2, brotli, and the rest. A zip built from
      # windeployqt alone launches fine on a machine with MSYS2 installed and
      # fails on every machine without one, which is every user's machine.
      #
      # So walk `ldd` over everything staged and copy each dependency that
      # lives under the UCRT64 prefix, to a fixpoint -- the Qt plugins have
      # their own dependencies, so one pass is not enough. On the build this
      # was developed against: pass 1 copied 28 files, pass 2 copied 0.
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          STAGE="dist/Trowel-${VER}-windows-x86_64"
          rm -rf dist && mkdir -p "$STAGE"

          cp build/trowel.exe "$STAGE/"
          [ -d build/turmeric ] && cp -r build/turmeric "$STAGE/"

          windeployqt6 --release --no-translations --dir "$STAGE" "$STAGE/trowel.exe"

          for pass in 1 2 3 4 5; do
            added=0
            while read -r src; do
              base=$(basename "$src")
              if [ ! -f "$STAGE/$base" ]; then cp "$src" "$STAGE/"; added=$((added+1)); fi
            done < <(find "$STAGE" \( -name '*.exe' -o -name '*.dll' \) \
                     -exec ldd {} \; 2>/dev/null | awk '/ucrt64/ {print $3}' | sort -u)
            echo "dependency pass $pass: copied $added"
            [ "$added" -eq 0 ] && break
          done

          # Fail LOUDLY rather than shipping a zip that cannot start. Without
          # this the job is green and the user gets "the code execution cannot
          # proceed because libgcc_s_seh-1.dll was not found".
          missing=0
          while read -r f; do
            while read -r d; do
              if [ ! -f "$STAGE/$d" ]; then echo "::error::unstaged dependency $d (needed by $f)"; missing=1; fi
            done < <(ldd "$f" 2>/dev/null | grep -i ucrt64 | awk '{print $1}')
          done < <(find "$STAGE" \( -name '*.exe' -o -name '*.dll' \))
          [ "$missing" -eq 0 ] || { echo "::error::package is not self-contained"; exit 1; }

          OUT="dist/Trowel-${VER}-windows-x86_64.zip"
          ( cd dist && zip -qr "$(basename "$OUT")" "$(basename "$STAGE")" )
          sha256sum "$OUT" | awk '{print $1}' > "${OUT}.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # The check that actually matters: run the packaged binaries with MSYS2
      # OFF the PATH, which is the environment a user has. `--version` exits
      # before any window is created, so it works on a headless runner.
      #
      # In bash rather than pwsh, deliberately. `trowel.exe` is a GUI-subsystem
      # binary; PowerShell's `&` waits on a stdout stream it never closes, and
      # the step HANGS instead of failing -- verified locally, where it ran to
      # the tool timeout twice while the identical command in bash printed
      # "Trowel 0.2.1" and exited 0. A smoke test that can hang is worse than
      # none: it burns the job's whole budget and reports nothing.
      #
      # `timeout` wraps `env`, not the other way round, so the wrapper is
      # resolved BEFORE the PATH is stripped -- otherwise `timeout` resolves to
      # Windows' own timeout.exe out of System32, which takes different
      # arguments and fails with "Invalid syntax".
      - name: Smoke-test the package without MSYS2 on PATH
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          STAGE="dist/Trowel-${VER}-windows-x86_64"
          CLEAN="/c/Windows/System32:/c/Windows"

          timeout 60 env PATH="$CLEAN" "./$STAGE/trowel.exe" --version
          if [ -f "$STAGE/turmeric/bin/tur.exe" ]; then
            timeout 60 env PATH="$CLEAN" "./$STAGE/turmeric/bin/tur.exe" --version
          fi
          echo "package runs standalone."

      - name: Publish Windows zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.sha256
          fail_on_unmatched_files: true
